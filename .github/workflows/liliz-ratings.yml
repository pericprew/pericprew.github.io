# Daily App Store ratings snapshot for stats.lilizlab.com (LILIZ 數據中心).
# Apple blocks its public rating endpoints for Cloudflare Workers, so GitHub fetches them here
# (public repo = free Actions) and commits liliz-stats/ratings.json; the Worker reads it hourly.
name: App Store ratings

on:
  schedule:
    - cron: "41 19 * * *" # 03:41 Taiwan time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liliz-ratings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch ratings from every storefront
        run: node liliz-stats/fetch-ratings.mjs
      - name: Commit snapshot
        run: |
          if git diff --quiet -- liliz-stats/ratings.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liliz-stats/ratings.json
          git commit -m "liliz-stats: daily App Store ratings snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
